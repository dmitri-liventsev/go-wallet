version: '3.8'

services:
  web1:
    build:
      context: .
      dockerfile: transaction/cmd/Dockerfile
    container_name: web1
    volumes:
      - .:/app
    command: ["air"]
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=txdb
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web2:
    build:
      context: .
      dockerfile: transaction/cmd/Dockerfile
    container_name: web2
    volumes:
      - .:/app
    command: ["air"]
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=txdb
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8082:8080"
    depends_on:
      web1:
        condition: service_healthy
      db:
        condition: service_healthy

  web3:
    build:
      context: .
      dockerfile: transaction/cmd/Dockerfile
    container_name: web3
    volumes:
      - .:/app
    command: ["air"]
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=txdb
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8083:8080"
    depends_on:
      web1:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:13
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: txdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

volumes:
  postgres_data:
